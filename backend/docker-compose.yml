version: '3.8'

services:
  redis-cache:
    image: redis:latest
    container_name: my-kanban-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redis_insight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      - redis-cache

volumes:
  redisinsight_data: 